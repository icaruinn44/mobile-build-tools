name: Owner premium mobile archive
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mystic-premium-31
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'icaruinn44/mobile-build-tools' && github.actor == 'icaruinn44' && github.ref == 'refs/heads/mystic-premium-31-20261109'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      PAYLOAD_KEY: ${{ secrets.MYSTIC31_PAYLOAD_KEY }}
      INPUT_SHA256: ${{ vars.MYSTIC31_INPUT_SHA256 }}
      ASC_KEY_BASE64: ${{ secrets.MYSTIC31_ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.MYSTIC31_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.MYSTIC31_ASC_ISSUER_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.MYSTIC31_IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ''
      BUNDLE_ID: com.mistikdevelopment.mysticera
      APPLE_TEAM_ID: 4J4H8P56ZW
      BUILD_NAME: 1.0.28
      BUILD_NUMBER: '31'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install verified build helpers
        run: python -m pip install cryptography==50.0.2 codemagic-cli-tools==0.70.0 Pillow==12.0.0 PyJWT==2.10.1
      - name: Open authenticated private input
        run: python sealed_ci.py init
      - name: Resolve and verify premium dependencies and tests
        run: python sealed_ci.py deps
      - name: Configure existing distribution signing
        run: python sealed_ci.py sign
      - name: Archive and verify premium build 31
        run: python sealed_ci.py archive
      - name: Upload verified premium package to Apple
        run: python sealed_ci.py upload
      - name: Capture optional premium simulator screens after upload
        continue-on-error: true
        run: python sealed_ci.py screens
      - name: Encrypt diagnostics and binary artifacts
        if: always()
        run: python sealed_ci.py package
      - name: Save encrypted owner artifact
        id: publish_result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f encrypted-result.bin
          gh release create "result-${GITHUB_RUN_ID}" encrypted-result.bin --repo "$GITHUB_REPOSITORY" --target mystic-premium-31-20261109 --title 'Encrypted owner build result' --notes 'Authenticated encrypted build result. Application files and diagnostics are not published in plaintext.'
      - name: Save encrypted recovery artifact
        if: always() && steps.publish_result.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-owner-result-${{ github.run_id }}
          path: encrypted-result.bin
          retention-days: 1
