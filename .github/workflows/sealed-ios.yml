name: Owner mobile archive
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owner-mobile-archive-judge52
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'icaruinn44/mobile-build-tools' && github.actor == 'icaruinn44' && github.ref == 'refs/heads/portfolio-judge52-20261108'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      PAYLOAD_KEY: ${{ secrets.JUDGE52_PAYLOAD_KEY }}
      INPUT_SHA256: f30b5192af68db224a8671c71c31a192372fc00ddf07c7ba718138583592e6dd
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.JUDGE52_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ''
      BUNDLE_ID: com.mistikdevelopment.judgegame
      APPLE_TEAM_ID: 4J4H8P56ZW
      BUILD_NAME: 3.8.11
      BUILD_NUMBER: '52'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install verified build helpers
        run: python -m pip install cryptography==50.0.2 codemagic-cli-tools==0.70.0 Pillow==12.0.0 PyJWT==2.10.1
      - name: Open authenticated private input
        run: python sealed_ci.py init
      - name: Resolve and verify application dependencies
        run: python sealed_ci.py deps
      - name: Verify privacy contracts and app regressions
        run: python sealed_ci.py startup
      - name: Configure distribution signing
        run: python sealed_ci.py sign
      - name: Archive and verify distribution package
        run: python sealed_ci.py archive
      - name: Upload verified package to Apple
        run: python sealed_ci.py upload
      - name: Encrypt diagnostics and binary artifacts
        if: always()
        run: python sealed_ci.py package
      - name: Save encrypted owner artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f encrypted-result.bin
          gh release create "result-${GITHUB_RUN_ID}" encrypted-result.bin --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Encrypted owner build result' --notes 'Authenticated encrypted build result.'
