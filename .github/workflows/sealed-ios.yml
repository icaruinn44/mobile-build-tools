name: Owner mobile archive
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: owner-mobile-evidence-mistik67
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'icaruinn44/mobile-build-tools' && github.actor == 'icaruinn44' && github.ref == 'refs/heads/mistik-ios-evidence-20261109'
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      PAYLOAD_KEY: ${{ secrets.MISTIK67_PAYLOAD_KEY }}
      INPUT_SHA256: c95be7d02fec0f28acde108f0b059d175719bfdacd797c717921e052b2bd6abb
      BUNDLE_ID: com.mistikdevelopment.mistik
      APPLE_TEAM_ID: 4J4H8P56ZW
      REVIEW_CONFIG_BASE64: ${{ secrets.MISTIK67_REVIEW_CONFIG_BASE64 }}
      CI_APP_CHECK_DEBUG_TOKEN: ${{ secrets.MISTIK67_APP_CHECK_DEBUG_TOKEN }}
      BUILD_NAME: 6.1.4
      BUILD_NUMBER: '67'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install verified build helpers
        run: python -m pip install cryptography==50.0.2 codemagic-cli-tools==0.70.0 Pillow==12.0.0 PyJWT==2.10.1
      - name: Open authenticated private input
        run: python sealed_ci.py init
      - name: Resolve and verify application dependencies
        run: python sealed_ci.py deps
      - name: Verify privacy contracts and app regressions
        run: python sealed_ci.py startup
      - name: Encrypt diagnostics and binary artifacts
        if: always()
        run: python sealed_ci.py package
      - name: Save encrypted owner artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f encrypted-result.bin
          gh release create "result-${GITHUB_RUN_ID}" encrypted-result.bin --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Encrypted owner build result' --notes 'Authenticated encrypted build result.'
